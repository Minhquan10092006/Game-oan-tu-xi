<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Xếp Hạng — Oẳn Tù Tì 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a1a;
      color: #e0e0f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1a3e 0%, #0d0d2b 100%);
      border-bottom: 1px solid #2a2a5a;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: none;
      border: 1px solid #3a3a6a;
      color: #aaa;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all .2s;
    }
    .back-btn:hover { border-color: #7c6fff; color: #e0e0f0; }
    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: #f0c040;
    }

    /* ── Container ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    /* ── Top 3 podium ── */
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 40px;
    }
    .podium-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .podium-medal { font-size: 2rem; }
    .podium-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: #e0e0f0;
      max-width: 120px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-elo {
      font-family: 'Fira Code', monospace;
      font-size: 1rem;
      font-weight: 700;
    }
    .podium-base {
      border-radius: 8px 8px 0 0;
      width: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
    }
    .podium-slot:nth-child(1) .podium-base { background: linear-gradient(180deg,#c0a020,#806810); height: 80px; color:#ffe060; }
    .podium-slot:nth-child(1) .podium-elo  { color: #f0c040; }
    .podium-slot:nth-child(2) .podium-base { background: linear-gradient(180deg,#909090,#505050); height: 60px; color:#e0e0e0; }
    .podium-slot:nth-child(2) .podium-elo  { color: #c0c0c0; }
    .podium-slot:nth-child(3) .podium-base { background: linear-gradient(180deg,#a05020,#603010); height: 48px; color:#e08040; }
    .podium-slot:nth-child(3) .podium-elo  { color: #cd7f32; }
    .podium-empty .podium-name { color: #444; }
    .podium-empty .podium-elo  { color: #333; }

    /* ── Table ── */
    .table-card {
      background: #12122a;
      border: 1px solid #2a2a5a;
      border-radius: 14px;
      overflow: hidden;
    }
    .table-header {
      padding: 20px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e1e40;
    }
    .table-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      color: #7c6fff;
    }
    .refresh-btn {
      background: none;
      border: 1px solid #2a2a5a;
      color: #666;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all .2s;
    }
    .refresh-btn:hover { border-color: #7c6fff; color: #e0e0f0; }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      padding: 12px 20px;
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #555;
      font-weight: 500;
      border-bottom: 1px solid #1e1e40;
    }
    tbody tr {
      border-bottom: 1px solid #1a1a30;
      transition: background .15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(124,111,255,.05); }
    tbody tr.highlight-me { background: rgba(124,111,255,.08); }
    td {
      padding: 13px 20px;
      font-size: 0.88rem;
      vertical-align: middle;
    }

    .rank-num {
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #555;
      width: 48px;
    }
    .rank-num.top1 { color: #f0c040; font-weight: 700; }
    .rank-num.top2 { color: #c0c0c0; font-weight: 700; }
    .rank-num.top3 { color: #cd7f32; font-weight: 700; }

    .username { font-weight: 600; }
    .username.is-me::after {
      content: ' (bạn)';
      font-size: 0.72rem;
      color: #7c6fff;
      font-weight: 400;
    }

    .elo-val {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      color: #7c6fff;
    }

    .stat { font-size: 0.8rem; color: #888; font-family: 'Fira Code', monospace; }

    .winrate-bar-wrap {
      width: 80px;
      height: 5px;
      background: #1a1a3a;
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    .winrate-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #4caf50, #7c6fff);
    }
    .winrate-text { font-family: 'Fira Code', monospace; font-size: 0.8rem; color: #888; }

    /* ── Loading / empty ── */
    .loading-row td, .empty-row td {
      text-align: center;
      color: #444;
      padding: 40px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #2a2a5a;
      border-top-color: #7c6fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* ── My rank banner ── */
    #my-rank-banner {
      background: rgba(124,111,255,.08);
      border: 1px solid rgba(124,111,255,.25);
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: none;
      align-items: center;
      gap: 16px;
    }
    #my-rank-banner .banner-label { font-size: 0.8rem; color: #888; }
    #my-rank-banner .banner-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #7c6fff;
      font-weight: 700;
    }
    #my-rank-banner .sep { color: #333; }

    @media (max-width: 600px) {
      .podium { gap: 6px; }
      .podium-base { width: 80px; }
      td, th { padding: 10px 12px; }
      .winrate-bar-wrap { display: none; }
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="back-btn">⬅ Menu</a>
  <h1>🏆 BẢNG XẾP HẠNG</h1>
</header>

<div class="container">

  <!-- Podium top 3 -->
  <div class="podium" id="podium">
    <!-- Được render bằng JS -->
  </div>

  <!-- Banner hạng của mình (nếu đăng nhập) -->
  <div id="my-rank-banner">
    <div>
      <div class="banner-label">Hạng của bạn</div>
      <div class="banner-val" id="my-rank-num">—</div>
    </div>
    <div class="sep">|</div>
    <div>
      <div class="banner-label">ELO</div>
      <div class="banner-val" id="my-elo-val">—</div>
    </div>
    <div class="sep">|</div>
    <div>
      <div class="banner-label">Thắng / Thua</div>
      <div class="banner-val" id="my-wl">—</div>
    </div>
  </div>

  <!-- Bảng xếp hạng -->
  <div class="table-card">
    <div class="table-header">
      <h2>📊 Top 50 người chơi</h2>
      <button class="refresh-btn" onclick="loadRanking()">🔄 Làm mới</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Tên</th>
          <th>ELO</th>
          <th>Thắng</th>
          <th>Thua</th>
          <th>Tỉ lệ thắng</th>
          <th>Số trận</th>
        </tr>
      </thead>
      <tbody id="ranking-body">
        <tr class="loading-row">
          <td colspan="7"><span class="spinner"></span> Đang tải...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const CURRENT_USER = '{{ user.username|default:"" }}';

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadRanking() {
  const tbody = document.getElementById('ranking-body');
  tbody.innerHTML = '<tr class="loading-row"><td colspan="7"><span class="spinner"></span> Đang tải...</td></tr>';

  try {
    const resp = await fetch('/api/ranking/');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    renderPodium(data.slice(0, 3));
    renderTable(data);
    renderMyBanner(data);
  } catch(e) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">⚠️ Không tải được dữ liệu: ${e.message}</td></tr>`;
  }
}

function renderPodium(top) {
  const order = [top[1], top[0], top[2]]; // 2nd, 1st, 3rd
  const heights = ['#909090', '#f0c040', '#cd7f32'];
  const labels = ['2', '1', '3'];
  const medals = ['🥈', '🥇', '🥉'];

  const el = document.getElementById('podium');
  el.innerHTML = order.map((p, i) => {
    if (!p) return `
      <div class="podium-slot podium-empty">
        <div class="podium-medal" style="opacity:.2">${medals[i]}</div>
        <div class="podium-name" style="color:#333">—</div>
        <div class="podium-elo" style="color:#222">—</div>
        <div class="podium-base" style="background:#111;height:${[60,80,48][i]}px;width:110px;border-radius:8px 8px 0 0"></div>
      </div>`;
    const isMe = p.username === CURRENT_USER;
    return `
      <div class="podium-slot">
        <div class="podium-medal">${medals[i]}</div>
        <div class="podium-name">${escHtml(p.username)}${isMe ? ' 👤' : ''}</div>
        <div class="podium-elo" style="color:${heights[i]}">${p.elo}</div>
        <div class="podium-base" style="background:linear-gradient(180deg,${heights[i]}99,${heights[i]}44);height:${[60,80,48][i]}px">
          ${labels[i]}
        </div>
      </div>`;
  }).join('');
}

function renderTable(data) {
  const tbody = document.getElementById('ranking-body');
  if (!data.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Chưa có người chơi nào.</td></tr>';
    return;
  }

  const rankClass = r => r === 1 ? 'top1' : r === 2 ? 'top2' : r === 3 ? 'top3' : '';
  const rankIcon  = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;

  tbody.innerHTML = data.map(p => {
    const isMe = p.username === CURRENT_USER;
    const pct = p.win_rate;
    return `
      <tr class="${isMe ? 'highlight-me' : ''}">
        <td class="rank-num ${rankClass(p.rank)}">${rankIcon(p.rank)}</td>
        <td class="username ${isMe ? 'is-me' : ''}">${escHtml(p.username)}</td>
        <td class="elo-val">${p.elo}</td>
        <td class="stat" style="color:#4caf50">${p.wins}</td>
        <td class="stat" style="color:#f44336">${p.losses}</td>
        <td>
          <div class="winrate-bar-wrap">
            <div class="winrate-bar" style="width:${pct}%"></div>
          </div>
          <span class="winrate-text">${pct}%</span>
        </td>
        <td class="stat">${p.total_games}</td>
      </tr>`;
  }).join('');
}

function renderMyBanner(data) {
  if (!CURRENT_USER) return;
  const me = data.find(p => p.username === CURRENT_USER);
  if (!me) return;
  const banner = document.getElementById('my-rank-banner');
  banner.style.display = 'flex';
  document.getElementById('my-rank-num').textContent = '#' + me.rank;
  document.getElementById('my-elo-val').textContent = me.elo;
  document.getElementById('my-wl').textContent = me.wins + 'W / ' + me.losses + 'L';
}

loadRanking();
</script>
</body>
</html>
