<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Oẳn Tù Tì 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a1a;
      color: #e0e0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #12122a;
      border: 1px solid #2a2a5a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(124,111,255,.15);
    }
    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #7c6fff;
      text-align: center;
      margin-bottom: 6px;
    }
    h2 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 28px;
      color: #e0e0f0;
    }
    label {
      display: block;
      font-size: 0.82rem;
      color: #aaa;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%;
      background: #0d0d20;
      border: 1px solid #2a2a5a;
      border-radius: 8px;
      color: #e0e0f0;
      padding: 11px 14px;
      font-size: 0.92rem;
      transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #7c6fff; }
    .btn {
      margin-top: 24px;
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #5a4fcf, #7c6fff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .9; }
    .error {
      background: rgba(244,67,54,.1);
      border: 1px solid rgba(244,67,54,.3);
      border-radius: 8px;
      color: #f44336;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #666;
    }
    .footer-link a { color: #7c6fff; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.8rem;
      color: #444;
      text-decoration: none;
    }
    .back-home:hover { color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚔️ OẲN TÙ TÌ 2.0</div>
    <h2>Đăng nhập</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label>Tên đăng nhập</label>
      <input type="text" name="username" autofocus autocomplete="username" required>
      <label>Mật khẩu</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn">Đăng nhập</button>
    </form>

    <div class="footer-link">
      Chưa có tài khoản? <a href="/register/">Đăng ký ngay</a>
    </div>
    <a href="/" class="back-home">← Về trang chủ</a>
  </div>
</body>
</html>
