<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Oẳn Tù Tì 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050505;
      color: #a6a9ad;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #0e0e0e;
      border: 1px solid #222222;
      border-radius: 6px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-family: "Geist Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a8d91;
      text-align: center;
      margin-bottom: 8px;
    }
    h2 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      color: #f2f2f2;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #f2f2f2;
      margin-bottom: 8px;
      margin-top: 18px;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%;
      background: #050505;
      border: 1px solid #303030;
      border-radius: 6px;
      color: #f2f2f2;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.12s ease-out;
    }
    input:focus { border-color: #f2f2f2; }
    .btn {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: #f2f2f2;
      border: 1px solid #f2f2f2;
      border-radius: 999px;
      color: #0a0a0a;
      font-size: 0.92rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s ease-out;
    }
    .btn:hover { background: #e0e0e0; }
    .error {
      background: #1a0e0e;
      border: 1px solid #4a1d1d;
      border-radius: 6px;
      color: #f87171;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #8a8d91;
    }
    .footer-link a { color: #f2f2f2; text-decoration: none; }
    .footer-link a:hover { color: #3fd6c6; }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: #8a8d91;
      text-decoration: none;
    }
    .back-home:hover { color: #f2f2f2; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">OẲN TÙ TÌ 2.0 / K71</div>
    <h2>Đăng nhập</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label>Tên đăng nhập</label>
      <input type="text" name="username" autofocus autocomplete="username" required>
      <label>Mật khẩu</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn">Đăng nhập</button>
    </form>

    <div class="footer-link">
      Chưa có tài khoản? <a href="/register/">Đăng ký ngay</a>
    </div>
    <a href="/" class="back-home">← Về trang chủ</a>
  </div>
</body>
</html>
