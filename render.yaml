databases:
  - name: game-oan-tu-xi-db
    databaseName: game_oan_tu_xi
    user: game_user
    plan: free

services:
  - type: web
    name: game-oan-tu-xi
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "game-oan-tu-xi.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: game-oan-tu-xi-db
          property: connectionString
      - key: JUDGE0_BASE_URL
        value: "https://ce.judge0.com"
      - key: JUDGE0_API_KEY
        value: ""
