# render.yaml - Cấu hình deploy cho giải 1 lần (SQLite + Redis)
services:
  - type: web
    name: ott-web
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT --worker-connections 2000 --http-timeout 60 --access-log - config.asgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ott-redis
          property: connectionURL
      - key: DATABASE_URL
        value: sqlite:///opt/render/project/src/db.sqlite3
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src
      sizeGB: 1
    healthCheckPath: /health/
    autoDeploy: true

  - type: redis
    name: ott-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []